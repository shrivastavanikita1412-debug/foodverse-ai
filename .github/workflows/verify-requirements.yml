name: Verify Python requirements

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "backend/**"
      - ".github/workflows/verify-requirements.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Create clean virtual environment
        run: python -m venv .venv

      - name: Install requirements
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Verify installed packages and backend import
        run: |
          .venv/bin/python -m pip check
          .venv/bin/python -c "import fastapi, uvicorn, cv2, numpy, PIL, pydantic; print('Required package imports passed')"
          .venv/bin/python -c "from backend.main import app; print('Backend import passed:', app.title)"
